# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Starling Murmuration
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  prefetch: hover
  locale: en-US
  baseUrl: planckmaxxing.github.io/Website-A
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Inter
      body: Public Sans
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#e5e5e5"
        gray: "#6e6e73"
        darkgray: "#111111"
        dark: "#0a0a0b"
        secondary: "#a04646"
        tertiary: "#52525b"
        highlight: rgba(0, 0, 0, 0.045)
        textHighlight: "#fff23688"
      darkMode:
        light: "#1e1e1e"
        lightgray: "#333333"
        gray: "#999999"
        darkgray: "#dadada"
        dark: "#ededed"
        secondary: "#a04646"
        tertiary: "#b3b3b3"
        highlight: rgba(255, 255, 255, 0.06)
        textHighlight: "#b3aa0288"
  links:
    markdownLinkResolution: shortest
  contentIndex:
    enableSiteMap: true
    enableRSS: true
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 30
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 40
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45

layout:
  byPageType:
    content:
      template: murmuration
    folder:
      template: murmuration
    tag:
      template: murmuration
